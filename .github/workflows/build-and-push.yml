name: Build and Push Job
on:
  workflow_call:
    inputs:
      registry:
        description: 'Docker registry URL'
        required: false
        type: string
        default: 'docker.io'
      image-name:
        description: 'Docker image name'
        required: true
        type: string
      dockerfile:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: './Dockerfile'
    secrets:
      dockerhub-username:
        description: 'Docker Hub username'
        required: true
      dockerhub-token:
        description: 'Docker Hub token'
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to DockerHub
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ secrets.dockerhub-username }}
        password: ${{ secrets.dockerhub-token }}

    - name: Generate timestamp tag
      id: timestamp
      run: |
        # Get current date in YYYYMMDD format
        DATE=$(date +'%Y%m%d')
        
        # Get the count of existing images for today using Docker Hub API
        IMAGE_NAME="${{ inputs.image-name }}"
        USERNAME="${{ secrets.dockerhub-username }}"
        
        # Use Docker Hub API to get existing tags
        # First, get the authentication token
        TOKEN=$(curl -s -H "Content-Type: application/json" \
          -X POST \
          -d '{"username": "'$USERNAME'", "password": "'${{ secrets.dockerhub-token }}'"}' \
          https://hub.docker.com/v2/users/login/ | jq -r '.token')
        
        # Get all tags for the repository
        TAGS_RESPONSE=$(curl -s -H "Authorization: JWT $TOKEN" \
          "https://hub.docker.com/v2/repositories/$USERNAME/$IMAGE_NAME/tags/?page_size=100")
        
        # Count tags that match today's date pattern (YYYYMMDD.N)
        TODAY_COUNT=$(echo "$TAGS_RESPONSE" | jq -r '.results[] | select(.name | test("^'$DATE'\\.[0-9]+$")) | .name' | wc -l)
        
        # Calculate next build number
        BUILD_NUMBER=$((TODAY_COUNT + 1))
        
        # Generate timestamp
        TIMESTAMP="${DATE}.${BUILD_NUMBER}"
        
        echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
        echo "Generated timestamp: $TIMESTAMP"
        echo "Date: $DATE, Existing builds today: $TODAY_COUNT, New build number: $BUILD_NUMBER"

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        push: true
        tags: |
          ${{ inputs.registry }}/${{ secrets.dockerhub-username }}/${{ inputs.image-name }}:${{ steps.timestamp.outputs.timestamp }}
          ${{ inputs.registry }}/${{ secrets.dockerhub-username }}/${{ inputs.image-name }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64 