name: Vercel Deploy Job
on:
  workflow_call:
    inputs:
      project-type:
        description: 'Project type (react, nextjs, nestjs)'
        required: true
        type: string
        default: 'nextjs'
      vercel-project-id:
        description: 'Vercel project ID'
        required: true
        type: string
      vercel-org-id:
        description: 'Vercel organization ID'
        required: true
        type: string
      vercel-project-name:
        description: 'Vercel project name'
        required: true
        type: string
      node-version:
        description: 'Node.js version to use'
        required: false
        type: string
        default: '20'
      build-command:
        description: 'Build command to run'
        required: false
        type: string
        default: 'npm run build'
      api-url:
        description: 'API URL for environment variable'
        required: false
        type: string
        default: ''
    secrets:
      vercel-token:
        description: 'Vercel authentication token'
        required: true

jobs:
  vercel-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: ${{ inputs.build-command }}
      env:
        NEXT_PUBLIC_API_URL: ${{ inputs.api-url }}

    - name: Install Vercel CLI
      run: npm install --global vercel@latest

    - name: Verify Vercel Authentication
      env:
        VERCEL_TOKEN: ${{ secrets.vercel-token }}
      run: |
        echo "Verifying Vercel token..."
        vercel whoami --token=$VERCEL_TOKEN || {
          echo "❌ Error: Vercel token authentication failed!"
          echo "Please verify that VERCEL_TOKEN secret is correct and has proper permissions."
          exit 1
        }
        echo "✅ Vercel authentication successful"

    - name: Pull Vercel Environment Information
      env:
        VERCEL_TOKEN: ${{ secrets.vercel-token }}
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
      run: |
        echo "Pulling Vercel environment variables..."
        echo "Project ID: $VERCEL_PROJECT_ID"
        echo "Org ID: $VERCEL_ORG_ID"
        
        # Try to pull environment variables with scope
        vercel pull --yes --environment=production --token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID || {
          echo "⚠️ Warning: vercel pull failed, but continuing..."
          echo "This might be normal if environment variables are not needed or already set in Vercel dashboard."
        }

    - name: Build Project Artifacts
      env:
        VERCEL_TOKEN: ${{ secrets.vercel-token }}
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
      run: |
        vercel build --prod --token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID

    - name: Deploy Project Artifacts to Vercel (Production)
      env:
        VERCEL_TOKEN: ${{ secrets.vercel-token }}
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
      run: |
        # Use --scope to deploy as token owner instead of Git author
        vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')

    - name: Deploy Preview to Vercel (Preview)
      env:
        VERCEL_TOKEN: ${{ secrets.vercel-token }}
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
      run: |
        # Use --scope to deploy as token owner instead of Git author
        vercel deploy --prebuilt --token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID
      if: github.event_name == 'pull_request'

    - name: Get deployment URL
      id: deployment
      env:
        VERCEL_TOKEN: ${{ secrets.vercel-token }}
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
      run: |
        DEPLOYMENT_URL=$(vercel ls --token $VERCEL_TOKEN --scope=$VERCEL_ORG_ID | grep ${{ inputs.vercel-project-name }} | head -1 | awk '{print $2}')
        echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
        echo "✅ Deployed to: $DEPLOYMENT_URL"

    - name: Comment deployment URL
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `🚀 **Vercel Preview Deployment Complete!**
          
          **Preview URL:** ${{ steps.deployment.outputs.deployment_url }}
          
          This deployment was triggered by commit: \`${{ github.sha }}\``
          }) 