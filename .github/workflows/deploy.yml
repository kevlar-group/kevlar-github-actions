name: Deploy Job
on:
  workflow_call:
    inputs:
      image-name:
        description: 'Docker image name'
        required: true
        type: string
      deployment-path:
        description: 'Deployment path on server'
        required: false
        type: string
        default: '/opt/app'
      enable-nginx:
        description: 'Enable nginx configuration'
        required: false
        type: boolean
        default: false
      service-port:
        description: 'Internal service port for nginx proxy_pass'
        required: false
        type: string
      nginx-service-name:
        description: 'Name for nginx config file (e.g., kevlar-notification-service)'
        required: false
        type: string
      nginx-fqdn:
        description: 'FQDN(s) for the service (comma-separated for multiple, e.g., service.kevlargroup.xyz www.service.kevlargroup.xyz)'
        required: false
        type: string
      ssl-cert-path:
        description: 'SSL certificate path'
        required: false
        type: string
        default: '/etc/letsencrypt/live/kevlargroup.xyz/fullchain.pem'
      ssl-cert-key-path:
        description: 'SSL certificate key path'
        required: false
        type: string
        default: '/etc/letsencrypt/live/kevlargroup.xyz/privkey.pem'
    secrets:    
      ssh-private-key:
        description: 'SSH private key for server access'
        required: true
      server-host:
        description: 'Server hostname or IP'
        required: true
      server-user:
        description: 'Server username'
        required: true
      dockerhub-username:
        description: 'Docker Hub username'
        required: true
      dockerhub-token:
        description: 'Docker Hub token'
        required: true
        
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.ssh-private-key }}" | tr -d '\r' > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        eval "$(ssh-agent -s)"
        ssh-add ~/.ssh/id_rsa
        ssh-keyscan github.com >> ~/.ssh/known_hosts

    - name: Add server to known hosts
      run: |
        ssh-keyscan -H ${{ secrets.server-host }} >> ~/.ssh/known_hosts

    - name: Create deployment directory on server
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.server-user }}@${{ secrets.server-host }} "mkdir -p ${{ inputs.deployment-path }}"

    - name: Copy deployment files to server
      run: |
        # Copy docker-compose.yml (required)
        scp -o StrictHostKeyChecking=no docker-compose.yml ${{ secrets.server-user }}@${{ secrets.server-host }}:${{ inputs.deployment-path }}/
        
        # Copy init-db.sql if it exists
        if [ -f "init-db.sql" ]; then
          scp -o StrictHostKeyChecking=no init-db.sql ${{ secrets.server-user }}@${{ secrets.server-host }}:${{ inputs.deployment-path }}/
          echo "✅ init-db.sql copied successfully"
        else
          echo "ℹ️ init-db.sql not found, skipping..."
        fi
        
        # Copy env.example if it exists
        if [ -f "env.example" ]; then
          scp -o StrictHostKeyChecking=no env.example ${{ secrets.server-user }}@${{ secrets.server-host }}:${{ inputs.deployment-path }}/
          echo "✅ env.example copied successfully"
        else
          echo "ℹ️ env.example not found, skipping..."
        fi
        
        # Copy .env if it exists (commented out by default)
        # if [ -f ".env" ]; then
        #   scp -o StrictHostKeyChecking=no .env ${{ secrets.server-user }}@${{ secrets.server-host }}:${{ inputs.deployment-path }}/
        #   echo "✅ .env copied successfully"
        # else
        #   echo "ℹ️ .env not found, skipping..."
        # fi

    - name: Deploy to server
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.server-user }}@${{ secrets.server-host }} << 'EOF'
          cd ${{ inputs.deployment-path }}
          
          # Check if docker-compose command exists, use docker compose if not
          if command -v docker-compose &> /dev/null; then
            COMPOSE_CMD="docker-compose"
          else
            COMPOSE_CMD="docker compose"
          fi

          # Login to Docker Hub to avoid rate limiting
          echo "${{ secrets.dockerhub-token }}" | docker login -u ${{ secrets.dockerhub-username }} --password-stdin
          # Pull the latest image
          docker pull ${{ secrets.dockerhub-username }}/${{ inputs.image-name }}:latest
          
          # Stop existing containers
          $COMPOSE_CMD -f docker-compose.yml down
          
          # Start the application (docker-compose will automatically use .env file)
          $COMPOSE_CMD -f docker-compose.yml up -d
          
          # Clean up old images
          docker image prune -f
          
          # Show running containers
          $COMPOSE_CMD -f docker-compose.yml ps
        EOF

    - name: Configure Nginx
      if: inputs.enable-nginx == true
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.server-user }}@${{ secrets.server-host }} 'bash -s' << 'REMOTE_SCRIPT'
          # Validate required inputs
          if [ -z "${{ inputs.service-port }}" ] || [ -z "${{ inputs.nginx-service-name }}" ] || [ -z "${{ inputs.nginx-fqdn }}" ]; then
            echo "❌ Error: service-port, nginx-service-name, and nginx-fqdn are required when enable-nginx is true"
            exit 1
          fi
          
          NGINX_SERVICE_NAME="${{ inputs.nginx-service-name }}"
          SERVICE_PORT="${{ inputs.service-port }}"
          NGINX_FQDN="${{ inputs.nginx-fqdn }}"
          SSL_CERT="${{ inputs.ssl-cert-path }}"
          SSL_KEY="${{ inputs.ssl-cert-key-path }}"
          
          # Split FQDN by comma and create server_name line
          SERVER_NAMES=$(echo "$NGINX_FQDN" | tr ',' ' ')
          
          # Create nginx config file
          NGINX_CONFIG="/etc/nginx/sites-available/$NGINX_SERVICE_NAME"
          
          # Write nginx config using printf and sudo tee to avoid heredoc YAML issues
          printf '%s\n' \
            "# HTTPS Server Block for $NGINX_SERVICE_NAME" \
            "server {" \
            "    listen 443 ssl;" \
            "    server_name $SERVER_NAMES;" \
            "" \
            "    # SSL Certificate paths" \
            "    ssl_certificate $SSL_CERT;" \
            "    ssl_certificate_key $SSL_KEY;" \
            "" \
            "    # Optional SSL settings for better security" \
            "    ssl_protocols TLSv1.2 TLSv1.3;" \
            "    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';" \
            "    ssl_prefer_server_ciphers on;" \
            "    ssl_session_cache shared:SSL:10m;" \
            "    ssl_session_timeout 1h;" \
            "    ssl_session_tickets off;" \
            "" \
            "    # HSTS (HTTP Strict Transport Security) (optional)" \
            "    add_header Strict-Transport-Security \"max-age=31536000; includeSubDomains\" always;" \
            "" \
            "    location / {" \
            "        proxy_pass http://127.0.0.1:$SERVICE_PORT;" \
            "        proxy_set_header Host \$host;" \
            "        proxy_set_header X-Real-IP \$remote_addr;" \
            "        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;" \
            "        proxy_set_header X-Forwarded-Proto \$scheme;" \
            "        " \
            "        # Additional headers for API" \
            "        proxy_set_header X-Forwarded-Host \$host;" \
            "        proxy_set_header X-Forwarded-Port \$server_port;" \
            "        " \
            "        # Timeout settings" \
            "        proxy_connect_timeout 60s;" \
            "        proxy_send_timeout 60s;" \
            "        proxy_read_timeout 60s;" \
            "    }" \
            "    " \
            "    # Health check endpoint" \
            "    location /actuator/health {" \
            "        proxy_pass http://127.0.0.1:$SERVICE_PORT/actuator/health;" \
            "        proxy_set_header Host \$host;" \
            "        proxy_set_header X-Real-IP \$remote_addr;" \
            "        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;" \
            "        proxy_set_header X-Forwarded-Proto \$scheme;" \
            "        " \
            "        # Allow health checks without authentication" \
            "        proxy_set_header Authorization \"\";" \
            "    }" \
            "}" \
            "" \
            "# Redirect HTTP to HTTPS" \
            "server {" \
            "    listen 80;" \
            "    server_name $SERVER_NAMES;" \
            "" \
            "    location / {" \
            "        return 301 https://\$host\$request_uri;" \
            "    }" \
            "}" | sudo tee "$NGINX_CONFIG" > /dev/null
          
          echo "✅ Created nginx config file: $NGINX_CONFIG"
          
          # Create symbolic link in sites-enabled
          NGINX_ENABLED="/etc/nginx/sites-enabled/$NGINX_SERVICE_NAME"
          
          # Remove existing link if it exists
          if [ -L "$NGINX_ENABLED" ]; then
            sudo rm "$NGINX_ENABLED"
            echo "ℹ️ Removed existing symbolic link"
          fi
          
          # Create new symbolic link
          sudo ln -s "$NGINX_CONFIG" "$NGINX_ENABLED"
          echo "✅ Created symbolic link: $NGINX_ENABLED -> $NGINX_CONFIG"
          
          # Test nginx configuration
          if sudo nginx -t; then
            echo "✅ Nginx configuration test passed"
            
            # Reload nginx
            if sudo systemctl reload nginx; then
              echo "✅ Nginx reloaded successfully"
            else
              echo "⚠️ Failed to reload nginx, attempting restart..."
              sudo systemctl restart nginx
              echo "✅ Nginx restarted"
            fi
          else
            echo "❌ Nginx configuration test failed"
            sudo nginx -t
            exit 1
          fi
        REMOTE_SCRIPT

    - name: Verify deployment
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.server-user }}@${{ secrets.server-host }} << 'EOF'
          # Wait for application to start
          sleep 30
          
          # Check if docker-compose command exists, use docker compose if not
          if command -v docker-compose &> /dev/null; then
            COMPOSE_CMD="docker-compose"
          else
            COMPOSE_CMD="docker compose"
          fi
          
          # Check if containers are running
          if $COMPOSE_CMD -f ${{ inputs.deployment-path }}/docker-compose.yml ps | grep -q "Up"; then
            echo "✅ Deployment successful! Containers are running."
            
            # Test application health
            if curl -f http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "✅ Application health check passed!"
            else
              echo "⚠️ Application health check failed, but containers are running."
            fi
          else
            echo "❌ Deployment failed! Containers are not running."
            $COMPOSE_CMD -f ${{ inputs.deployment-path }}/docker-compose.yml logs
            exit 1
          fi
        EOF
